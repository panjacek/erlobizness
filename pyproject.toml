[project]
name = "erlobiznes"
version = "0.1.0"
description = "Eurobiznes-style (Polish Monopoly) board game as a FastAPI + vanilla JS web app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.5",
    "httpx>=0.28.1",
    "watchfiles>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
pythonpath = "src"

[tool.coverage.run]
source = ["src/erlobiznes"]
omit = ["tests/*"]
